name: build

on:
  pull_request:
    paths: &paths
      - 'bin/**'
      - 'config/**'
      - 'resources/**'
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/build.yml'
      - 'composer.json'
      - 'phpunit.xml.dist'

  push:
    branches: ['master']
    paths: *paths

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: PHP ${{ matrix.php }}

    runs-on: ubuntu-latest

    strategy:
      matrix:
        php:
          - 8.1
          - 8.2
          - 8.3
          - 8.4
          - 8.5

    steps:
      - name: Checkout.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install PHP with extensions.
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          ini-values: date.timezone='UTC', pcov.directory=${{ github.workspace }}, pcov.exclude=#^(?!(${{ github.workspace }}/config/|${{ github.workspace }}/src/)).*#
          coverage: pcov

      - name: Install Composer dependencies + required yiisoft/db and yiisoft/db-sqlite
        uses: yiisoft/actions/install-packages@master
        with:
          packages: >-
            ['db', 'db-sqlite']

      - name: Run tests with phpunit.
        run: vendor/bin/phpunit --testsuite=Migration,Sqlite --coverage-clover=coverage.xml --colors=always --display-warnings --display-deprecations

      - name: Upload coverage to Codecov.
        if: matrix.php == '8.5'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml

name: changelog

on:
  pull_request:
    paths:
      - 'bin/**'
      - 'config/**'
      - 'resources/**'
      - 'src/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changelog:
    uses: yiisoft/actions/.github/workflows/changelog.yml@master
